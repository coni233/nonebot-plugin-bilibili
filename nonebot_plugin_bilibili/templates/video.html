<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Noto Sans SC", -apple-system, "PingFang SC", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
  width: 580px;
  background: linear-gradient(135deg, #d3edfa 0%, #c8e6f5 50%, #b8def5 100%);
  padding: 20px;
}
.card {
  background: #fff;
  border-radius: 16px;
  width: 100%;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  overflow: hidden;
}
.card-inner { border-radius: 16px; overflow: hidden; }

/* 顶部角标 */
.badges { position: relative; height: 0; overflow: visible; z-index: 2; }
.badge-l {
  position: absolute; top: 12px; left: 0;
  background: linear-gradient(135deg, #fb7299, #f5576c);
  color: #fff; font-size: 12px; font-weight: 600;
  padding: 4px 16px; border-radius: 0 12px 12px 0;
  box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  display: flex; align-items: center; gap: 4px;
}

/* 封面区域 */
.cover-wrap {
  position: relative; width: 100%;
}
.cover-img {
  width: 100%; display: block;
  opacity: 0.92;
}
.duration {
  position: absolute; bottom: 12px; right: 12px;
  background: rgba(0,0,0,0.78); color: #fff;
  font-size: 12px; padding: 2px 10px; border-radius: 6px;
  letter-spacing: 0.5px;
}
.title-overlay {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 30px 14px 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.8));
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.4;
  text-align: left;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}


/* 作者栏 */
.author-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px;
}
.author-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  object-fit: cover; border: 2px solid #e8e8e8;
  flex-shrink: 0;
}
.author-name {
  font-size: 15px; font-weight: 700; color: #fb7299;
}
.author-time {
  font-size: 12px; color: #999; margin-top: 2px;
}





/* 统计 */
.stats-bar {
  display: flex; gap: 20px;
  padding: 10px 18px;
  border-top: 1px solid #f1f2f3;
  font-size: 12px; color: #9499a0;
}


</style>
</head>
<body>
<div class="card">
<div class="badges">
  <div class="badge-l">▶ 投稿视频</div>
</div>
<div class="card-inner">

{% if media_cover %}
<div class="cover-wrap">
  <img class="cover-img" src="{{ media_cover }}" alt="cover">
  {% if media_badge %}
  <div class="duration">{{ media_badge }}</div>
  {% endif %}
  <div class="title-overlay">{{ media_title }}</div>
</div>
{% endif %}

<div class="author-bar">
  <img class="author-avatar" src="{{ avatar }}" alt="avatar" onerror="this.style.display='none'">
  <div>
    <div class="author-name">{{ name }}</div>
    <div class="author-time">{{ time }} · {{ pub_time }}</div>
  </div>

</div>



{% if show_stats %}
<div class="stats-bar">
  <span>💬 {{ comment_count }} 评论</span>
  <span>🔄 {{ forward_count }} 转发</span>
  <span>❤️ {{ like_count }} 点赞</span>
</div>
{% endif %}


</div>
</div>
</body>
</html>
