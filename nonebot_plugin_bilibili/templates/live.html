<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Noto Sans SC", -apple-system, "PingFang SC", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
  width: 580px;
  background: linear-gradient(135deg, #d3edfa 0%, #c8e6f5 50%, #b8def5 100%);
  padding: 20px;
}
.card {
  background: #fff;
  border-radius: 16px;
  width: 100%;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  overflow: hidden;
}
.live-cover-wrap {
  position: relative;
  width: 100%;
  height: 300px;
  overflow: hidden;
  background: linear-gradient(135deg, #fb7299, #178bcf);
}
.live-cover {
  width: 100%;
  height: 100%;
  object-fit: cover;
}  

.live-status-badge {
  position: absolute;
  top: 12px;
  left: 0;
  background: #ff4d4d;
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  padding: 4px 14px;
  border-radius: 0 12px 12px 0;
  display: flex;
  align-items: center;
  gap: 4px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
.live-dot {
  width: 8px;
  height: 8px;
  background: #fff;
  border-radius: 50%;
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
.live-title-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 20px 16px 16px;
  background: linear-gradient(transparent, rgba(0,0,0,0.7));
}
.live-title {
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.host-info {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
}
.host-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #e8e8e8;
}
.host-name {
  font-size: 15px;
  font-weight: 600;
  color: #fb7299;
}
.host-uid {
  font-size: 12px;
  color: #9499a0;
}
.live-info {
  padding: 0 20px 14px;
  display: flex;
  gap: 20px;
  font-size: 13px;
  color: #61666d;
  border-bottom: 1px solid #f1f2f3;
}


</style>
</head>
<body>
<div class="card">
  <div class="live-cover-wrap">
    <img class="live-cover" src="{{ cover }}" alt="cover" onerror="this.style.display='none';this.parentElement.style.background='#333'">
    <div class="live-status-badge">
      <span class="live-dot"></span>
      直播中
    </div>
    <div class="live-title-overlay">
      <div class="live-title">{{ title }}</div>
    </div>
  </div>

  <div class="host-info">
    <img class="host-avatar" src="{{ avatar }}" alt="avatar" onerror="this.style.display='none'">
    <div>
      <div class="host-name">{{ name }}</div>
      <div class="host-uid">UID: {{ uid }}</div>

    </div>
  </div>

  <div class="live-info">
    <span>{{ area }}</span>
    <span>{{ start_time }}</span>
  </div>



</div>
</body>
</html>
