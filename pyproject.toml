[project]
name = "nonebot-plugin-bilibili"
version = "1.3.1"
description = "Bilibili 动态/直播订阅推送插件 for NoneBot2 — 支持动态/视频/直播通知、Web后台管理、扫码登录"
authors = [
    { name = "mengbingnaixi", email = "mengbingnaixi@users.noreply.github.com" },
]
dependencies = [
    "nonebot2>=2.5.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-htmlrender>=0.6.7",
    "nonebot-plugin-localstore>=0.7.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "jinja2>=3.0",
    "qrcode>=7.4",
    "pillow>=9.1.0",
    "pydantic>=2.0",
    "playwright>=1.40",
    "python-multipart>=0.0.9",
    "regex>=2024.5.15",
]
requires-python = ">=3.10,<4.0"
readme = "README.md"
keywords = [
    "nonebot",
    "nonebot2",
    "nonebot-plugin",
    "bilibili",
    "onebot",
    "onebot-v11",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Topic :: Communications :: Chat",
    "Topic :: Internet",
    "Intended Audience :: Developers",
]

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/mengbingnaixi/nonebot-plugin-bilibili"
Repository = "https://github.com/mengbingnaixi/nonebot-plugin-bilibili"
Documentation = "https://github.com/mengbingnaixi/nonebot-plugin-bilibili#readme"
Issues = "https://github.com/mengbingnaixi/nonebot-plugin-bilibili/issues"

[project.entry-points."nonebot.plugin"]
nonebot-plugin-bilibili = "nonebot_plugin_bilibili"

[build-system]
requires = [
    "pdm-backend",
]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = [
    "nonebot_plugin_bilibili",
]
excludes = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
]

[tool.pdm.dev-dependencies]
dev = [
    "black>=24.4.2",
    "isort>=5.13.2",
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pdm.scripts]
test = "pytest -W ignore -q"

[tool.pdm.scripts.format]
composite = [
    "isort . ",
    "black . ",
    "ruff check .",
]

[tool.black]
line-length = 100
target-version = [
    "py310",
    "py311",
    "py312",
    "py313",
]
include = "\\.pyi?$"
extend-exclude = ""

[tool.isort]
profile = "black"
line_length = 100
length_sort = true
skip_gitignore = false
force_sort_within_sections = true
extra_standard_library = [
    "typing_extensions",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "UP",
    "B",
    "ASYNC",
]
ignore = [
    "E402",
]

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
]
plugins = [
    "nonebot_plugin_bilibili",
]
plugin_dirs = []
builtin_plugins = []
