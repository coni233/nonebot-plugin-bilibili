[project]
name = "nonebot-plugin-bilibili"
version = "1.1.0"
description = "Bilibili 动态/直播订阅推送插件 for NoneBot2"
authors = [
    { name = "mengbingnaixi", email = "mengbingnaixi@users.noreply.github.com" },
]
license = { text = "MIT" }
requires-python = ">=3.10,<4.0"
readme = "README.md"
keywords = [
    "nonebot",
    "nonebot2",
    "nonebot-plugin",
    "bilibili",
    "onebot",
    "onebot-v11",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Communications :: Chat",
    "Topic :: Internet",
    "Intended Audience :: Developers",
]

dependencies = [
    "nonebot2>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-htmlrender>=0.6.7",
    "nonebot-plugin-localstore>=0.7.0",
    "httpx>=0.28.0",
    "jinja2>=3.0",
    "qrcode>=7.4",
    "pydantic>=2.0",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pdm-backend",
]

[project.urls]
Homepage = "https://github.com/mengbingnaixi/nonebot-plugin-bilibili"
Repository = "https://github.com/mengbingnaixi/nonebot-plugin-bilibili"
Documentation = "https://github.com/mengbingnaixi/nonebot-plugin-bilibili#readme"
Issues = "https://github.com/mengbingnaixi/nonebot-plugin-bilibili/issues"

[project.entry-points."nonebot.plugin"]
nonebot-plugin-bilibili = "nonebot_plugin_bilibili"

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
]
plugins = ["nonebot_plugin_bilibili"]
plugin_dirs = []
builtin_plugins = []

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = ["nonebot_plugin_bilibili"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
