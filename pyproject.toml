[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-bilibili"
version = "1.0.2"
description = "Bilibili 动态/直播 订阅推送插件 for NoneBot2"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "mengbingnaixi", email = "mengbingnaixi@users.noreply.github.com"}
]
requires-python = ">=3.10, <4.0"
keywords = ["nonebot", "bilibili", "b站", "动态", "直播"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "nonebot2[fastapi,httpx,websockets]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-htmlrender>=0.6.7",
    "nonebot-plugin-apscheduler>=0.5.0",
    "httpx>=0.27.0",
    "jinja2>=3.0",
]

[project.urls]
Homepage = "https://github.com/mengbingnaixi/nonebot-plugin-bilibili"
Repository = "https://github.com/mengbingnaixi/nonebot-plugin-bilibili"
"NoneBot Store" = "https://registry.nonebot.dev/plugin/nonebot-plugin-bilibili"

[tool.nonebot]
plugins = ["nonebot_plugin_bilibili"]

[tool.setuptools]
packages = ["nonebot_plugin_bilibili"]

[tool.setuptools.package-data]
nonebot_plugin_bilibili = ["templates/*.html"]
