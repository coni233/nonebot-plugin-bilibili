<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B站后台登录</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #d3edfa 0%, #c8e6f5 50%, #b8def5 100%);
  min-height: 100vh;
  display: flex; justify-content: center; align-items: center;
}
.login-box {
  background: #fff; border-radius: 16px; padding: 32px;
  width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  text-align: center;
}
.login-box h2 { font-size: 20px; color: #fb7299; margin-bottom: 8px; }
.login-box p { font-size: 13px; color: #9499a0; margin-bottom: 24px; }
.login-box input {
  width: 100%; padding: 10px 14px; border: 1px solid #e8e8e8;
  border-radius: 8px; font-size: 14px; outline: none; margin-bottom: 16px;
}
.login-box input:focus { border-color: #178bcf; }
.login-box button {
  width: 100%; padding: 10px; border: none; border-radius: 8px;
  background: #178bcf; color: #fff; font-size: 14px; cursor: pointer;
}
.login-box button:hover { background: #1479b8; }
.login-box .error { color: #fb7299; font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
<div class="login-box">
  <h2>B站通知助手</h2>
  <p>请输入管理密码</p>
  <input id="password" type="password" placeholder="密码" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">登录</button>
  <div class="error" id="error"></div>
</div>
<script>
async function login() {
  const pwd = document.getElementById('password').value;
  const err = document.getElementById('error');
  try {
    const r = await fetch('/bili/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: pwd})
    });
    const d = await r.json();
    if (d.success) {
      window.location.href = '/bili/';
    } else {
      err.textContent = d.error || '登录失败';
    }
  } catch(e) {
    err.textContent = '网络错误';
  }
}
</script>
</body>
</html>
